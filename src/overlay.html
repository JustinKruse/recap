<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Select region</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    .hint {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 18, 22, 0.9);
      color: #e8ebf0;
      border: 1px solid #262c36;
      border-radius: 999px;
      padding: 7px 16px;
      font: 12.5px/1 system-ui, "Segoe UI", sans-serif;
      letter-spacing: 0.03em;
      pointer-events: none;
    }
    .hint b { color: #ff4545; font-weight: 600; }
  </style>
</head>
<body>
  <div class="hint"><b>Drag</b> to select a region &nbsp;·&nbsp; <b>Esc</b> to cancel</div>
  <canvas id="c"></canvas>
  <script src="overlay.js"></script>
</body>
</html>
