[package]
name = "recap"
version = "0.1.0"
description = "Minimal Snagit-style screen recorder (ffmpeg + Tauri 2)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "recap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the region-select overlay needs a transparent window,
# which Tauri gates behind this feature. No effect on Windows. Note that apps
# using it cannot ship on the Mac App Store — fine for direct/notarized
# distribution, which is the plan.
# image-png: decoding the editor's flattened PNG for the clipboard.
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
# Images cross the IPC bridge as data URLs, so both ends need base64.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

# Vision.framework, reached directly rather than through a Swift helper: no
# Xcode toolchain needed at build time and no extra binary to bundle and sign.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
