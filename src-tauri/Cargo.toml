[package]
name = "recap"
version = "0.1.0"
description = "Minimal Snagit-style screen recorder (ffmpeg + Tauri 2)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "recap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the region-select overlay needs a transparent window,
# which Tauri gates behind this feature. No effect on Windows. Note that apps
# using it cannot ship on the Mac App Store — fine for direct/notarized
# distribution, which is the plan.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
