[package]
name = "recap"
version = "0.1.0"
description = "Minimal Snagit-style screen recorder (ffmpeg + Tauri 2)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "recap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
